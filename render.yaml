databases:
  - name: campusmate-db
    databaseName: campusmate
    user: campusmate
    plan: free

services:
  - type: web
    name: campusmate-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm ci --prefix server && npm run build
    startCommand: node server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusmate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
